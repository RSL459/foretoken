#
# Provides default settings for the Foretoken control-plane chart.

image:
  repository: ghcr.io/shiweijiezero/foretoken/control-plane
  tag: "" # Defaults to Chart.appVersion.
  digest: "" # Overrides tag when an immutable digest is provided.
  pullPolicy: IfNotPresent

imagePullSecrets: []

workload:
  # Secret names are resolved independently in each ModelService namespace.
  imagePullSecrets: []

inferenceEngine:
  profileRevision: default
  image:
    repository: ghcr.io/shiweijiezero/foretoken/model-server
    tag: "" # Defaults to Chart.appVersion.
    digest: "" # Overrides tag when an immutable digest is provided.
  modelServerPort: 9000
  gpu:
    type: nvidia
    resourceName: nvidia.com/gpu
    runtimeClassName: ""
    nodeSelector:
      key: ""
      value: ""

# Resource sizing is workload- and cluster-dependent; measure before setting it.
resources: {}
# resources:
#   requests:
#     cpu: 20m
#     memory: 64Mi
#   limits:
#     cpu: 200m
#     memory: 256Mi
